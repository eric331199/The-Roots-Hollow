<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
<link rel="apple-touch-icon" href="icon.PNG">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陰盤奇門排盤</title>

<style>
  /* ── Reset ── */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Base ── */
  body {
    background: #f5f0e8;
    font-family: "Noto Serif TC", "SimSun", "STSong", serif;
  }
  .page {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 10px 12px 32px;
    display: flex;
    flex-direction: column;
  }
  /* ══════════════════════════════════
     盤頭 Header  (3欄: 50 / 25 / 25)
  ══════════════════════════════════ */
  .header {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    grid-template-rows: auto auto;
    border: 2px solid #111;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    margin-top: 0;
    margin-bottom: 16px;
    width: calc(100% - 12px);
    margin-left: auto;
    margin-right: auto;
  }

  .h-col-left  { grid-column: 1; grid-row: 1; border-right: 1px solid #ddd; padding: 6px 8px; }
  .h-col-left2 { grid-column: 1; grid-row: 2; border-right: 1px solid #ddd; border-top: 2px solid #111; padding: 4px 8px 6px; }
  .h-col-mid   { grid-column: 2 / 4; grid-row: 1; padding: 6px 8px; }
  .h-col-ref   { grid-column: 2 / 4; grid-row: 2; border-top: 2px solid #111; padding: 4px 8px 6px; }


  /* table 共用 */
  .h-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .h-table tr { line-height: 1.85; }
  .h-table td {
    font-family: "Noto Serif TC", serif;
    font-size: 11px;
    color: #333;
    white-space: nowrap;
    overflow: hidden;
    vertical-align: middle;
  }
  /* 標籤欄（右對齊、灰色） */
  .h-table td.hl {
    color: #aaa;
    text-align: center;
    width: 2.5em;
  }
  /* 內容欄（置中） */
  .h-table td.hv {
    text-align: center;
    padding-left: 0;
    padding-right: 0;
  }

  /* ══════════════════════════════════
     九宮格外層 + 引干
  ══════════════════════════════════ */
  .outer {
    position: relative;
    width: calc(100% - 44px);
    aspect-ratio: 1 / 1;
    margin: 32px auto 20px;
  }

  /* 引干：8個方位 */
  .yigan {
    position: absolute;
    font-size: 15px;
    font-weight: normal;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .yigan-top    { top: -20px; left: 50%; transform: translateX(-50%); }
  .yigan-bottom { bottom: -20px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
  .yigan-left   { left: -18px; top: 50%; transform: translateY(-50%); flex-direction: column; line-height: 1.2; }
  .yigan-right  { right: -18px; top: 50%; transform: translateY(-50%); flex-direction: column; line-height: 1.2; }
  .yigan-tl { top: -20px; left: -16px; }
  .yigan-tr { top: -20px; right: -16px; }
  .yigan-bl { bottom: -20px; left: -16px; }
  .yigan-br { bottom: -20px; right: -16px; }

  /* ══════════════════════════════════
     九宮 Grid  (3×3 cell wrapper)
  ══════════════════════════════════ */
  .grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    box-sizing: border-box;
    position: relative;
  }

  /* 宮位 wrapper：負責邊框、點擊、高亮 */
  .cell {
    border: 1px solid #999;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    background: #fff;
    cursor: pointer;
    box-sizing: border-box;
    overflow: hidden;
    min-width: 0; min-height: 0;
  }

  /* 外框粗邊 2px + 圓角 */
  .grid .cell:nth-child(1),
  .grid .cell:nth-child(2),
  .grid .cell:nth-child(3) { border-top:    2px solid #111; }
  .grid .cell:nth-child(7),
  .grid .cell:nth-child(8),
  .grid .cell:nth-child(9) { border-bottom: 2px solid #111; }
  .grid .cell:nth-child(1),
  .grid .cell:nth-child(4),
  .grid .cell:nth-child(7) { border-left:   2px solid #111; }
  .grid .cell:nth-child(3),
  .grid .cell:nth-child(6),
  .grid .cell:nth-child(9) { border-right:  2px solid #111; }
  .grid .cell:nth-child(1) { border-radius: 12px 0 0 0; }
  .grid .cell:nth-child(3) { border-radius: 0 12px 0 0; }
  .grid .cell:nth-child(7) { border-radius: 0 0 0 12px; }
  .grid .cell:nth-child(9) { border-radius: 0 0 12px 0; }

  /* 高亮 */
  .cell.highlighted { border-color: #e67e22 !important; background: #fffaf5; }

  /* 每個小格：只畫右邊和下邊 */
  .gc {
    border-top: none;
    border-left: none;
    border-right: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
    background: transparent;
    box-sizing: border-box;
    overflow: hidden;
    min-width: 0; min-height: 0;
  }

  /* 每宮最右欄、最下列不畫線（cell 外框已畫） */
  .gc[style*="grid-column:3;"] { border-right:  none; }
  .gc[style*="grid-row:3;"]    { border-bottom: none; }

  /* 中宮 */
  .cell.center { background: #eeebe3; cursor: default; border: none; }
  /* 中宮小格：全部自己負責四邊 */
  .gc-center {
    background: transparent;
    border-top: none;
    border-left: none;
    border-right: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
  }
  /* col1：加左邊（中宮外框左邊） */
  #g5r1c1, #g5r2c1, #g5r3c1 { border-left: 1px solid #999; }
  /* row1：加上邊（中宮外框上邊） */
  #g5r1c1, #g5r1c2, #g5r1c3 { border-top: 1px solid #999; }
  /* col3：右邊（中宮外框右邊） */
  #g5r1c3, #g5r2c3, #g5r3c3 { border-right: 1px solid #999; }
  /* row3：下邊（中宮外框下邊） */
  #g5r3c1, #g5r3c2, #g5r3c3 { border-bottom: 1px solid #999; }
  .tag { font-size: 11px; line-height: 1; margin-top: 1px; }
  .tag.entombed   { color: #999; font-size: 9px; line-height: 1; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); }
  .tag.penalized { color: #c0392b; font-size: 9px; line-height: 1; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); }
  .tag.entombed.has-penalized  { left: 50%; transform: translateX(-100%); }
  .tag.penalized.has-entombed  { left: 50%; transform: translateX(0%); right: auto; }
  .stem-mu  { display: inline-block; position: relative; }
  .stem-char { color: #aaa; }
  .stem-char.penalized { color: #c0392b; }
  .tag.gate-constraint   { color: #c0392b; font-size: 9px; line-height: 1; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); }
  .tag.void {
    color: #c0392b; font-size: 12px; line-height: 1;
    border: 1px solid #c0392b; border-radius: 50%;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .tag.horse {
    color: #2471a3; font-size: 11px; line-height: 1;
    position: relative; display: inline-flex; align-items: center; justify-content: center;
  }
  .tag.horse::before {
    content: '△';
    font-size: 27px;
    color: #2471a3;
    line-height: 1;
    position: absolute;
  }
  .tag.horse span {
    position: relative; z-index: 1;
    font-size: 10px; margin-top: 4px;
  }
  .zhifu-badge {
    font-size: 9px; color: #c0392b;
    border: 1px solid #c0392b;
    padding: 0 2px; border-radius: 2px;
  }

  /* ── 左上格（宮號＋八卦）── */
  .gc-left {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 3px 1px;
    gap: 2px;
  }
  .house-id { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 2px; }
  .house-num  { font-size: 13px; font-weight: bold; color: #333; line-height: 1.2; }
  .house-name { font-size: 13px; color: #555; line-height: 1.2; }
  .bagua { display: flex; flex-direction: column; gap: 2px; align-items: center; margin-top: 2px; }
  .bline-full { width: 16px; height: 2px; background: var(--line-color, #444); border-radius: 1px; }
  .bline-broken { display: flex; gap: 3px; }
  .bline-broken span { width: 6px; height: 2px; background: var(--line-color, #444); border-radius: 1px; display: block; }

  /* ── 左中（空白）── */
  .gc-left2 {}

  /* ── 左下（馬）── */
  .gc-horse {
    display: flex; flex-direction: row;
    align-items: center; justify-content: center; gap: 1px;
  }

  /* ── 中上（神）── */
  .gc-shen {
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #333;
  }

  /* ── 中中（星）── */
  .gc-star {
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #333; gap: 2px;
  }

  /* ── 中下（門）── */
  .gc-gate {
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #333;
  }

  /* ── 右上（空亡）── */
  .gc-void {
    display: flex; flex-direction: row;
    align-items: center; justify-content: center; gap: 1px;
  }

  /* ── 右中（天盤干）── */
  .gc-tian {
    display: flex; flex-direction: row;
    align-items: center; justify-content: center;
    font-size: 14px; color: #333;
  }

  /* ── 右下（地盤干）── */
  .gc-di {
    display: flex; flex-direction: row;
    align-items: center; justify-content: center;
    font-size: 14px; color: #333;
  }

  /* ── 中宮地支時鐘盤 ── */
  .dz-corner { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; font-size: 9px; color: #aaa; width:100%; height:100%; }
  .dz-corner span { display: flex; align-items: center; justify-content: center; }
  .dz-edge { font-size: 9px; color: #aaa; display: flex; align-items: center; justify-content: center; width:100%; height:100%; }
  .dz-wu  { align-items: flex-start !important; }
  .dz-zi  { align-items: flex-end !important; }
  .dz-mao { justify-content: flex-start !important; padding-left: 2px; }
  .dz-you { justify-content: flex-end !important; padding-right: 2px; }
  .dz-center { display: flex; align-items: center; justify-content: center; font-size: 13px; color: #bbb; width:100%; height:100%; }
  .dz-active { color: #c0392b !important; font-weight: bold; }


    /* ══════════════════════════════════
     輸入區
  ══════════════════════════════════ */
  hr.divider {
    border: none;
    border-top: 1px solid #ddd;
    margin: 16px 0;
  }
  .input-area {
    width: calc(100% - 44px);
    background: #fff;
    border: 1px solid #999;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 0;
    margin-left: auto;
    margin-right: auto;
  }
  .input-title {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 10px;
    text-align: center;
    letter-spacing: 1px;
  }
  .input-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .input-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .input-row label {
    font-size: 12px;
    color: #aaa;
  }
  .input-row input {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 4px 2px;
    font-size: 16px;
    text-align: center;
    font-family: inherit;
    color: #333;
    -moz-appearance: textfield;
  }
  .input-row input::-webkit-outer-spin-button,
  .input-row input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .input-row input.input-error {
    border: 1px solid #c0392b;
    background: #fdecea;
  }
  .input-error-msg {
    font-size: 13px;
    color: #c0392b;
    text-align: center;
    margin-top: 8px;
    display: none;
  }
  .input-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .btn-now {
    background: #fff;
    border: 1.5px solid #888;
    border-radius: 4px;
    padding: 8px;
    font-size: 15px;
    font-family: inherit;
    color: #555;
    cursor: pointer;
  }
  .btn-quick {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 8px 0;
    font-size: 13px;
    font-family: inherit;
    color: #666;
    cursor: pointer;
    flex: 1;
    letter-spacing: .05em;
  }
  .btn-quick-row {
    display: flex;
    gap: 8px;
    margin: 10px 0 0;
  }
  .btn-start {
    background: #444;
    border: none;
    border-radius: 4px;
    padding: 8px;
    font-size: 15px;
    font-family: inherit;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="page">
<!-- 標題 -->
<div style="text-align:center; font-size:18px; font-weight:bold; color:#333; margin: 8px 0 12px; letter-spacing:2px;">陰盤奇門排盤</div>
<!-- 輸入區 -->
<div class="input-area">
  <div class="input-title">起盤時間</div>
  <div class="input-grid">
    <div class="input-row">
      <label>年</label>
      <input type="tel" id="year"  maxlength="4" inputmode="numeric">
    </div>
    <div class="input-row">
      <label>月</label>
      <input type="tel" id="month"  maxlength="2" inputmode="numeric">
    </div>
    <div class="input-row">
      <label>日</label>
      <input type="tel" id="day"  maxlength="2" inputmode="numeric">
    </div>
    <div class="input-row">
      <label>時</label>
      <input type="tel" id="hour"  maxlength="2" inputmode="numeric">
    </div>
    <div class="input-row">
      <label>分</label>
      <input type="tel" id="minute"  maxlength="2" inputmode="numeric">
    </div>
  </div>
  <div class="input-buttons">
    <button class="btn-now" onclick="resetChart()">重置</button>
    <button class="btn-start" onclick="clearHighlight();castChart()">排盤</button>
    <button class="btn-now" onclick="setNow()">現時</button>
  </div>
  <div class="input-error-msg" id="input-error-msg"></div>
</div>

<hr class="divider">
<!-- 盤面（預設隱藏）-->
<div id="paipan-result" style="display:block;">

<div class="header">
  <div class="h-col-left">
    <table class="h-table">
      <tr><td class="hl">西元</td><td class="hv" id="sy">—</td><td class="hv" id="sm">—</td><td class="hv" id="sd">—</td><td class="hv" id="st">—</td></tr>
      <tr><td class="hl">農曆</td><td class="hv" id="ly">—</td><td class="hv" id="lm">—</td><td class="hv" id="ld">—</td><td class="hv" id="lt">—</td></tr>
      <tr><td class="hl">天干</td><td class="hv" id="gz-y-gan">—</td><td class="hv" id="gz-m-gan">—</td><td class="hv" id="gz-d-gan">—</td><td class="hv" id="gz-h-gan">—</td></tr>
      <tr><td class="hl">地支</td><td class="hv" id="gz-y-zhi">—</td><td class="hv" id="gz-m-zhi">—</td><td class="hv" id="gz-d-zhi">—</td><td class="hv" id="gz-h-zhi">—</td></tr>
    </table>
  </div>
  <div class="h-col-left2">
    <table class="h-table">
      <tr>
        <td class="hl">陰陽</td>
        <td class="hv">甲乙</td>
        <td class="hv">丙丁</td>
        <td class="hv">戊己</td>
        <td class="hv">庚辛</td>
        <td class="hv">壬癸</td>
      </tr>
    </table>
  </div>
  <div class="h-col-mid">
    <table class="h-table">
      <tr><td class="hl">起局</td><td class="hv" id="hb-qiju">—</td><td class="hl">類型</td><td class="hv" id="hb-fuyin">—</td></tr>
      <tr><td class="hl">旬首</td><td class="hv" id="hb-xun">—</td><td class="hl">符頭</td><td class="hv" id="hb-dutyStem">—</td></tr>
      <tr><td class="hl">值符</td><td class="hv" id="hb-zhifu">—</td><td class="hl">值使</td><td class="hv" id="hb-zhishi">—</td></tr>
      <tr><td class="hl">空亡</td><td class="hv" id="hb-voidBranches">—</td><td class="hl">驛馬</td><td class="hv" id="hb-travel-horse">—</td></tr>
    </table>
  </div>
  <div class="h-col-ref">
    <table class="h-table">
      <tr>
        <td class="hl">合干</td>
        <td class="hv">甲己</td>
        <td class="hv">乙庚</td>
        <td class="hv">丙辛</td>
        <td class="hv">丁壬</td>
        <td class="hv">戊癸</td>
      </tr>
    </table>
  </div>
</div>

<div class="outer">

  <div class="yigan yigan-top"    id="yin-9"></div>
  <div class="yigan yigan-bottom" id="yin-1"></div>
  <div class="yigan yigan-left"   id="yin-3"></div>
  <div class="yigan yigan-right"  id="yin-7"></div>
  <div class="yigan yigan-tl"     id="yin-4"></div>
  <div class="yigan yigan-tr"     id="yin-2"></div>
  <div class="yigan yigan-bl"     id="yin-8"></div>
  <div class="yigan yigan-br"     id="yin-6"></div>

  <div class="grid">
    <!-- 4 巽 -->
    <div class="cell" data-gong="4">
    <div id="g4r1c1" class="gc gc-left" style="grid-column:1;grid-row:1;"><div class="house-id"><span class="house-num" style="color:#4caf50;">4</span><span class="house-name" style="color:#4caf50;">巽</span></div><div class="bagua" style="--line-color:#4caf50;"><div class="bline-full"></div><div class="bline-full"></div><div class="bline-broken"><span></span><span></span></div></div></div>
    <div id="g4r1c2" class="gc gc-shen" style="grid-column:2;grid-row:1;"><span id="sh-4"></span></div>
    <div id="g4r1c3" class="gc gc-void" style="grid-column:3;grid-row:1;"><div id="void-4"></div></div>
    <div id="g4r2c1" class="gc gc-left2" style="grid-column:1;grid-row:2;"></div>
    <div id="g4r2c2" class="gc gc-star" style="grid-column:2;grid-row:2;"><span id="star-4"></span></div>
    <div id="g4r2c3" class="gc gc-tian" style="grid-column:3;grid-row:2;"><span id="tian-4"></span></div>
    <div id="g4r3c1" class="gc gc-horse" style="grid-column:1;grid-row:3;"><div id="horse-4"></div></div>
    <div id="g4r3c2" class="gc gc-gate" style="grid-column:2;grid-row:3;"><span id="gate-4"></span></div>
    <div id="g4r3c3" class="gc gc-di" style="grid-column:3;grid-row:3;"><span id="di-4"></span></div>
    </div>

    <!-- 9 離 -->
    <div class="cell" data-gong="9">
    <div id="g9r1c1" class="gc gc-left" style="grid-column:1;grid-row:1;"><div class="house-id"><span class="house-num" style="color:#c0392b;">9</span><span class="house-name" style="color:#c0392b;">離</span></div><div class="bagua" style="--line-color:#c0392b;"><div class="bline-full"></div><div class="bline-broken"><span></span><span></span></div><div class="bline-full"></div></div></div>
    <div id="g9r1c2" class="gc gc-shen" style="grid-column:2;grid-row:1;"><span id="sh-9"></span></div>
    <div id="g9r1c3" class="gc gc-void" style="grid-column:3;grid-row:1;"><div id="void-9"></div></div>
    <div id="g9r2c1" class="gc gc-left2" style="grid-column:1;grid-row:2;"></div>

<script>
// ── 入墓判定 ──
const ENTOMBED_TABLE = { '癸':2, '乙':6,'丙':6,'戊':6, '丁':8,'己':8,'庚':8, '辛':4,'壬':4 };

// ── 擊刑判定（六儀天干） ──
// 庚在艮(8)、壬在巽(4) 同時符合入墓與擊刑，兩者皆標記，天干顯示為擊刑紅色
const PENALIZED_TABLE = { '戊':3, '己':2, '庚':8, '辛':9, '壬':4, '癸':4 };

// 渲染天干字串（含寄干），有入墓或擊刑則標記
// isDutyHouse: 此格是否為符頭天干所在宮位（甲入墓判定用，天盤地盤皆適用）
function renderStemHTML(stem, house, dutyStem, isDutyHouse) {
  if (!stem) return '';
  return stem.split('').map(ch => {
    const isPenalized = !!PENALIZED_TABLE[ch] && PENALIZED_TABLE[ch] === house;
    let isEntombed = ENTOMBED_TABLE[ch] === house;
    if (!isEntombed && isDutyHouse && house === 2 && ch === dutyStem) isEntombed = true;

    if (isPenalized || isEntombed) {
      const charClass = isPenalized ? 'stem-char penalized' : 'stem-char';
      const fontSize = (isPenalized && isEntombed) ? '7px' : '9px';
      const muTag   = isEntombed   ? `<span class="tag entombed${isPenalized ? ' has-penalized' : ''}" style="font-size:${fontSize};">墓</span>` : '';
      const xingTag = isPenalized ? `<span class="tag penalized${isEntombed  ? ' has-entombed'  : ''}" style="font-size:${fontSize};">刑</span>` : '';
      return `<span class="stem-mu"><span class="${charClass}">${ch}</span>${muTag}${xingTag}</span>`;
    }
    return `<span>${ch}</span>`;
  }).join('');
}

function captureChart() {
  alert('請直接使用手機截圖儲存。');
}

// ── 門迫判定 ──
const GATE_CONSTRAINT_TABLE = {
  '休門': [9],
  '生門': [1],
  '傷門': [2, 8],
  '杜門': [2, 8],
  '景門': [6, 7],
  '死門': [1],
  '驚門': [3, 4],
  '開門': [3, 4],
};

function renderGateHTML(gate, house) {
  if (!gate) return '';
  const constraintHouses = GATE_CONSTRAINT_TABLE[gate] || [];
  if (constraintHouses.includes(house)) {
    return `<span style="position:relative;display:inline-block;color:#c0392b;">${gate}<span class="tag gate-constraint">迫</span></span>`;
  }
  return gate;
}

function resetChart() {
  clearHighlight();
  ['year','month','day','hour','minute'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.value = '';
      el.classList.remove('input-error');
    }
  });
  const msgEl = document.getElementById('input-error-msg');
  if (msgEl) { msgEl.textContent = ''; msgEl.style.display = 'none'; }
  ['sy','sm','sd','st','ly','lm','ld','lt',
   'gz-y-gan','gz-y-zhi','gz-m-gan','gz-m-zhi','gz-d-gan','gz-d-zhi','gz-h-gan','gz-h-zhi',
   'hb-qiju','hb-xun','hb-dutyStem','hb-voidBranches','hb-travel-horse','hb-zhifu','hb-zhishi'
  ].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = '—';
  });
  [1,2,3,4,6,7,8,9].forEach(g => {
    ['sh-','star-','gate-','tian-','di-','void-','horse-','yin-'].forEach(pre => {
      const el = document.getElementById(pre + g);
      if (el) el.innerHTML = '';
    });
  });
}

function getInputDate() {
  const y = parseInt(document.getElementById('year').value) || 0;
  const m = parseInt(document.getElementById('month').value) || 1;
  const d = parseInt(document.getElementById('day').value) || 1;
  const h = parseInt(document.getElementById('hour').value) || 0;
  const mn = parseInt(document.getElementById('minute').value) || 0;
  return new Date(y, m - 1, d, h, mn);
}

function setInputDate(dt) {
  document.getElementById('year').value = dt.getFullYear();
  document.getElementById('month').value = pad(dt.getMonth() + 1);
  document.getElementById('day').value = pad(dt.getDate());
  document.getElementById('hour').value = pad(dt.getHours());
  document.getElementById('minute').value = pad(dt.getMinutes());
}

function shiftDate(days) {
  const dt = getInputDate();
  dt.setDate(dt.getDate() + days);
  setInputDate(dt);
  castChart();
}

function shiftHour(hours) {
  const dt = getInputDate();
  dt.setHours(dt.getHours() + hours);
  setInputDate(dt);
  castChart();
}

function setNow() {
  setInputDate(new Date());
}

// 頁面載入時自動填入當前時間
window.addEventListener('DOMContentLoaded', setNow);

const pad = n => String(n).padStart(2, '0');

// ── 宮位點擊高亮 ──
// grid排列: 4(1) 9(2) 2(3) / 3(4) 5(5) 7(6) / 8(7) 1(8) 6(9)
const HOUSE_NEIGHBORS = {
  1:{right:2,bottom:4}, 2:{right:3,bottom:5}, 3:{bottom:6},
  4:{right:5,bottom:7}, 5:{right:6,bottom:8}, 6:{bottom:9},
  7:{right:8},          8:{right:9},           9:{}
};
// 預建反查表：left / top
const HOUSE_LEFT  = {};
const HOUSE_TOP   = {};
Object.keys(HOUSE_NEIGHBORS).forEach(k => {
  const n = HOUSE_NEIGHBORS[k];
  if (n.right)  HOUSE_LEFT[n.right]  = +k;
  if (n.bottom) HOUSE_TOP[n.bottom]  = +k;
});
const HIGHLIGHT_COLOR = '#e67e22';

// 宮位 → 中宮對應小格 id
const HOUSE_TO_DZ_CELL = {
  4: 'g5r1c1', 9: 'g5r1c2', 2: 'g5r1c3',
  3: 'g5r2c1',              7: 'g5r2c3',
  8: 'g5r3c1', 1: 'g5r3c2', 6: 'g5r3c3',
};

let _houseCells = null;
function getHouseCells() {
  if (!_houseCells) _houseCells = [...document.querySelectorAll('.grid .cell')];
  return _houseCells;
}

function clearHighlight() {
  getHouseCells().forEach(c => {
    c.classList.remove('highlighted');
    c.style.borderTopColor = c.style.borderBottomColor =
    c.style.borderLeftColor = c.style.borderRightColor = '';
  });
  // 清除中宮小格邊框
  document.querySelectorAll('.gc-center').forEach(gc => {
    gc.style.borderTopColor = gc.style.borderLeftColor =
    gc.style.borderRightColor = gc.style.borderBottomColor = '';
  });
}

document.querySelectorAll('.cell[data-gong]').forEach(cell => {
  cell.addEventListener('click', function() {
    const already = this.classList.contains('highlighted');
    clearHighlight();
    if (!already) {
      const cells = getHouseCells();
      const nth = cells.indexOf(this) + 1;
      this.classList.add('highlighted');
      this.style.borderTopColor = this.style.borderBottomColor =
      this.style.borderLeftColor = this.style.borderRightColor = HIGHLIGHT_COLOR;

      // 右側相鄰格左邊改橘
      const r = HOUSE_NEIGHBORS[nth]?.right;
      if (r) cells[r-1].style.borderLeftColor = HIGHLIGHT_COLOR;
      // 下側相鄰格上邊改橘
      const b = HOUSE_NEIGHBORS[nth]?.bottom;
      if (b) cells[b-1].style.borderTopColor = HIGHLIGHT_COLOR;
      // 左側相鄰格右邊改橘
      const lk = HOUSE_LEFT[nth];
      if (lk) cells[lk-1].style.borderRightColor = HIGHLIGHT_COLOR;
      // 上側相鄰格下邊改橘
      const tk = HOUSE_TOP[nth];
      if (tk) cells[tk-1].style.borderBottomColor = HIGHLIGHT_COLOR;

      // 中宮對應地支格：改四邊顏色
      const gong = parseInt(this.dataset.gong);
      const dzId = HOUSE_TO_DZ_CELL[gong];
      if (dzId) {
        const gc = document.getElementById(dzId);
        if (!gc) return;
        const row = parseInt(dzId[3]);
        const col = parseInt(dzId[5]);

        // right / bottom：直接改自身
        gc.style.borderRightColor  = HIGHLIGHT_COLOR;
        gc.style.borderBottomColor = HIGHLIGHT_COLOR;

        // top：row1 改自身 top（外框邊）；row2/3 改上方格 bottom
        if (row === 1) {
          gc.style.borderTopColor = HIGHLIGHT_COLOR;
        } else {
          document.getElementById(`g5r${row-1}c${col}`).style.borderBottomColor = HIGHLIGHT_COLOR;
        }

        // left：col1 改自身 left（外框邊）；col2/3 改左方格 right
        if (col === 1) {
          gc.style.borderLeftColor = HIGHLIGHT_COLOR;
        } else {
          document.getElementById(`g5r${row}c${col-1}`).style.borderRightColor = HIGHLIGHT_COLOR;
        }
      }
    }
  });
});

// 自動跳格
const INPUT_ORDER = ['year','month','day','hour','minute'];
const INPUT_MAXLEN = { year:4, month:2, day:2, hour:2, minute:2 };

INPUT_ORDER.forEach((id, idx) => {
  const el = document.getElementById(id);
  el.addEventListener('input', function() {
    // 只保留數字
    this.value = this.value.replace(/\D/g, '');
    if (this.value.length >= INPUT_MAXLEN[id]) {
      const next = INPUT_ORDER[idx + 1];
      if (next) document.getElementById(next).focus();
    }
  });
  el.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace' && this.value === '') {
      const prev = INPUT_ORDER[idx - 1];
      if (prev) {
        const prevEl = document.getElementById(prev);
        prevEl.focus();
        // 游標移到末位
        const len = prevEl.value.length;
        prevEl.setSelectionRange(len, len);
      }
    }
  });
});

// 地支序數
const EARTH_BRANCH_LIST = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

// 數字根（各位數相加到一位數，0視為9）
function digitalRoot(n) {
  while (n > 9) {
    n = String(n).split('').reduce((a, b) => a + parseInt(b), 0);
  }
  return n === 0 ? 9 : n;
}

// 取時辰地支
function hourToBranch(h) {
  // 子=23-1, 丑=1-3, ..., 亥=21-23
  const idx = Math.floor((h + 1) / 2) % 12;
  return EARTH_BRANCH_LIST[idx];
}

// 判斷陰陽遁：找開盤時間前最近的冬至或夏至
function getSolsticeType(y, m, d, h) {
  const openDate = new Date(y, m-1, d, h);

  // 搜尋前兩年到當年的節氣，找最近一個冬至或夏至的名稱
  let lastSolstice = null;

  for (let yr = y - 1; yr <= y; yr++) {
    const lunarYr = LunarYear.fromYear(yr);
    const jieQiDays = lunarYr.getJieQiJulianDays();

    // lunar-javascript 節氣順序固定，冬至是第0個，夏至是第12個（從冬至開始算）
    // 用 Solar.fromJulianDay 取得日期，再用 getLunar().getJieQi() 確認名稱
    for (let i = 0; i < jieQiDays.length; i++) {
      const s = Solar.fromJulianDay(jieQiDays[i]);
      const name = s.getLunar().getJieQi();
      if (name === '冬至' || name === '夏至') {
        const sDate = new Date(s.getYear(), s.getMonth()-1, s.getDay());
        if (sDate <= openDate) lastSolstice = name;
      }
    }
  }

  return lastSolstice === '冬至' ? '陽' : '陰';
}

// 計算局數
function getChartNumber(lunar, h, ec) {
  const yearBranch = ec.getYear()[1];       // 年支（節氣換年，取四柱年柱地支）
  const lunarMonth = Math.abs(lunar.getMonth()); // 農曆月
  const lunarDay = lunar.getDay();       // 農曆日
  const hourBranch = hourToBranch(h);         // 時支

  const yearBranchIdx = EARTH_BRANCH_LIST.indexOf(yearBranch) + 1;
  const hourBranchIdx = EARTH_BRANCH_LIST.indexOf(hourBranch) + 1;

  const sum = yearBranchIdx + lunarMonth + lunarDay + hourBranchIdx;
  return digitalRoot(sum);
}

// 實際順時針／逆時針（八神、八星、天盤天干、引干用）
const HOUSE_CW  = [1, 8, 3, 4, 9, 2, 7, 6]; // 順時針
const HOUSE_CCW = [1, 6, 7, 2, 9, 4, 3, 8]; // 逆時針

// 共用：從 startHouse 起，沿 order 方向，把 items 陣列從 headIdx 偏移開始依序放入8個宮位
// （八神、八星、天盤天干、引干普通法，皆為同一種「起點+方向+固定序列+偏移」的放置模式）
function placeInOrder(startHouse, order, items, headIdx = 0) {
  const startIdx = order.indexOf(parseInt(startHouse));
  const result = {};
  for (let i = 0; i < 8; i++) {
    result[order[(startIdx + i) % 8]] = items[(headIdx + i) % 8];
  }
  return result;
}

// 六儀三奇順序
const EARTH_STEM_ORDER = ['戊','己','庚','辛','壬','癸','丁','丙','乙'];

// 九宮完整順序（含5，供路中判斷用）
const HOUSE_FLY_ASC  = [1, 2, 3, 4, 5, 6, 7, 8, 9]; // 順時針含中宮
const HOUSE_FLY_DESC = [9, 8, 7, 6, 5, 4, 3, 2, 1]; // 逆時針含中宮

// 地盤固定對應：宮位→九星名稱、八門名稱
const HOUSE_STAR = { 1:'天蓬', 2:'天芮', 3:'天沖', 4:'天輔', 6:'天心', 7:'天柱', 8:'天任', 9:'天英' };
const HOUSE_GATE  = { 1:'休門', 2:'死門', 3:'傷門', 4:'杜門', 6:'開門', 7:'驚門', 8:'生門', 9:'景門' };

// 八神固定順序
const EIGHT_SPIRITS = ['值符','騰蛇','太陰','六合','白虎','玄武','九地','九天'];

// 排八神：時天干宮起，陽遁實際順時針，陰遁實際逆時針
function getSpiritMap(timeStemHouse, solsticeType) {
  const order = solsticeType === '陽' ? HOUSE_CW : HOUSE_CCW;
  return placeInOrder(timeStemHouse, order, EIGHT_SPIRITS);
}

// 地支→宮位對應表
const BRANCH_TO_HOUSE = {
  '子':1, '丑':8, '寅':8, '卯':3, '辰':4, '巳':4,
  '午':9, '未':2, '申':2, '酉':7, '戌':6, '亥':6
};

// 宮位→地支對應表（由 BRANCH_TO_HOUSE 反推）
const HOUSE_DZ = (() => {
  const map = {};
  Object.entries(BRANCH_TO_HOUSE).forEach(([dz, gong]) => {
    if (!map[gong]) map[gong] = [];
    map[gong].push(dz);
  });
  return map;
})();

// 馬星：時辰地支→馬星地支
const TRAVEL_HORSE_TABLE = {
  '申':'寅', '子':'寅', '辰':'寅',
  '寅':'申', '午':'申', '戌':'申',
  '巳':'亥', '酉':'亥', '丑':'亥',
  '亥':'巳', '卯':'巳', '未':'巳'
};

// 時干序數
const EIGHT_GATES = ['休門','生門','傷門','杜門','景門','死門','驚門','開門'];

// 地盤宮位→八門 index（對應 EIGHT_GATES）
const HOUSE_GATE_IDX = { 1:0, 2:5, 3:2, 4:3, 6:7, 7:6, 8:1, 9:4 };

// 時干序數
const HEAVEN_STEM_LIST = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];

// 排八門：從地盤值使門宮位走步，落點放值使門，其餘實際順時針放入
function getGateMap(dutyGateHouse, solsticeType, timeStem) {
  dutyGateHouse = parseInt(dutyGateHouse);
  // 時干序數（甲=1…癸=10），起點算第一步，所以走 steps-1 步
  const steps = HEAVEN_STEM_LIST.indexOf(timeStem) + 1;
  // 走步用含中宮的九宮數字順序（中宮5為獨立計數站，不可提前併入坤2）
  const walkOrder = solsticeType === '陽' ? HOUSE_FLY_ASC : HOUSE_FLY_DESC;
  const startIdx = walkOrder.indexOf(dutyGateHouse);
  // 走 steps-1 步（起點算第一步）
  let landGong = walkOrder[(startIdx + steps - 1) % 9];
  // 入中寄坤
  if (landGong === 5) landGong = 2;

  // 值使門的門名 index（中宮無門，查表時用寄坤後的2）
  const shimenMenIdx = HOUSE_GATE_IDX[dutyGateHouse === 5 ? 2 : dutyGateHouse];

  // 從落點起，實際順時針放入八門
  const landIdx = HOUSE_CW.indexOf(landGong);
  const result = {};
  for (let i = 0; i < 8; i++) {
    const gong = HOUSE_CW[(landIdx + i) % 8];
    result[gong] = EIGHT_GATES[(shimenMenIdx + i) % 8];
  }
  return result;
}

// 排引干：值使門落宮起，時天干為頭，沿地盤實際順時針序列切入，永遠順時針放入
// 星伏／門伏：純位置標記（八星/八門是否全部回到固定本宮），畫面顯示用，跟特例三觸發邏輯分開
// 特例三/四觸發前提：① 星伏（isStarFrozen）② 引干閉環（isGuidingClosed，值使門落宮地盤干含effectiveStem）
// 兩個觸發條件都成立才飛布；星伏/門伏的「位置」標記本身不直接決定要不要飛布
// earthStemSeq：實際順時針讀出的地盤天干序列（8個位置，由呼叫端算好傳入，避免與getHeavenStemMap重複計算）
function getHidingStemMap(dutyGateLandHouse, earthStemMap, earthStemSeq, timeStem, dutyStem, solsticeType, timeStemHouse, dutyStemHouse) {
  dutyGateLandHouse = parseInt(dutyGateLandHouse);

  // 決定實際使用的時干（甲不在地盤時改用符頭）
  const effectiveStem = (timeStem === '甲') ? dutyStem : timeStem;

  // 星伏（純位置）：時干所在地盤宮位 是否＝符頭所在地盤宮位（八星、天盤天干排列同一起點）
  const isStarFrozen = String(timeStemHouse) === String(dutyStemHouse);

  // 門伏（純位置）：值使門落宮 是否＝值使門固定本宮（＝符頭所在地盤宮位）。八門同一起點同一offset，單點檢查即代表全部八門
  const isGateFrozen = String(dutyGateLandHouse) === String(dutyStemHouse);

  // 引干閉環（觸發特例三用，內容檢查，跟門伏的位置檢查是不同條件）：
  // 值使門落宮的地盤干 是否包含 effectiveStem
  const diStemAtLand = earthStemMap[dutyGateLandHouse] || '';
  const isGuidingClosed = diStemAtLand.includes(effectiveStem);

  const isTripleSame = isStarFrozen && isGuidingClosed;

  let guidingMap;
  if (isTripleSame) {
    const stemOrder = EARTH_STEM_ORDER; // 戊己庚辛壬癸丁丙乙
    const walkFull = solsticeType === '陽'
      ? [5,6,7,8,9,1,2,3,4]
      : [5,4,3,2,1,9,8,7,6];

    // 飛布函數：將 centerStem 入中宮飛布，回傳 flyMap（中宮寄坤二前）
    function doFlyRaw(centerStem) {
      const centerIdx = stemOrder.indexOf(centerStem);
      const fm = {};
      for (let i = 0; i < 9; i++) {
        const gan = stemOrder[(centerIdx + i) % 9];
        const gong = walkFull[i];
        fm[gong] = (fm[gong] || '') + gan;
      }
      return fm;
    }

    // 特例三：effectiveStem 入中飛布
    let rawMap = doFlyRaw(effectiveStem);

    // 中宮寄坤二
    if (rawMap[5]) {
      rawMap[2] = (rawMap[2] || '') + rawMap[5];
      delete rawMap[5];
    }

    // 特例四：飛布後值使門落宮引干仍含 effectiveStem → 閉環
    // 改用坤二另一個天干入中飛布
    if ((rawMap[dutyGateLandHouse] || '').includes(effectiveStem)) {
      const otherStem = (rawMap[2] || '').split('').find(c => c !== effectiveStem);
      if (otherStem) {
        rawMap = doFlyRaw(otherStem);
        if (rawMap[5]) {
          rawMap[2] = (rawMap[2] || '') + rawMap[5];
          delete rawMap[5];
        }
      }
    }

    guidingMap = {};
    [1,2,3,4,6,7,8,9].forEach(g => { guidingMap[g] = rawMap[g] || ''; });
  } else {
    // 普通情況：從值使門落宮起，以 effectiveStem 為頭，順時針放入
    let headPos = earthStemSeq.findIndex(s => s.includes(effectiveStem));
    if (headPos === -1) headPos = 0;
    guidingMap = placeInOrder(dutyGateLandHouse, HOUSE_CW, earthStemSeq, headPos);
  }

  return { guidingMap, isStarFrozen, isGateFrozen };
}

const EIGHT_STARS = ['天蓬','天任','天沖','天輔','天英','天芮','天柱','天心'];

// 排八星：地盤時干宮起，值符星為頭，固定蓬任沖輔英芮柱心順時針
function getStarMap(timeStemHouse, dutyStar) {
  const headIdx = EIGHT_STARS.indexOf(dutyStar);
  return placeInOrder(timeStemHouse, HOUSE_CW, EIGHT_STARS, headIdx);
}

// 排天盤天干：地盤時干宮起，沿地盤實際順時針序列從符頭切入，永遠順時針放入
// earthStemSeq：實際順時針讀出的地盤天干序列（8個位置，由呼叫端算好傳入，避免與getHidingStemMap重複計算）
function getHeavenStemMap(timeStemHouse, earthStemSeq, dutyStem) {
  // 找符頭所在位置（位置index）
  const headPos = earthStemSeq.findIndex(s => s.includes(dutyStem));
  return placeInOrder(timeStemHouse, HOUSE_CW, earthStemSeq, headPos);
}

// 排地盤天干
// 回傳 { 宮位數: 天干 }，例如 { 1:'丙', 2:'戊乙', ... }
function getEarthStemMap(solsticeType, chartNum) {
  const result = {};
  const order9 = solsticeType === '陽' ? HOUSE_FLY_ASC : HOUSE_FLY_DESC; // 含5，9格

  // 找戊的起始宮位在9格順序中的 index
  const startIdx = order9.indexOf(chartNum);

  // 9個天干依序排入9格（含中宮5）
  for (let i = 0; i < 9; i++) {
    const gan = EARTH_STEM_ORDER[i];
    const gong = order9[(startIdx + i) % 9];
    if (result[gong]) {
      result[gong] = result[gong] + gan;
    } else {
      result[gong] = gan;
    }
  }
  // 中宮5原始天干（寄坤前），第六步排八門的數字走步需要用這個原始位置
  const houseFiveStem = result[5] || null;

  // 排完後，5宮天干寄坤（2）－ 此為「顯示用／空間旋轉用」的合併版本
  if (result[5]) {
    result[2] = result[2] ? result[2] + result[5] : result[5];
    delete result[5];
  }

  return { earthStemMap: result, houseFiveStem };
}

// 根據時柱干支找旬首資料（用完整干支配對）
function getDecInfo(timeStem, timeBranch) {
  const stemIdx = HEAVEN_STEM_LIST.indexOf(timeStem);
  const branchIdx = EARTH_BRANCH_LIST.indexOf(timeBranch);
  const posInXun = stemIdx; // 在旬中的位置就是天干序號（甲=0, 乙=1, ...）
  const decFirstBranchIdx = (branchIdx - posInXun + 12) % 12;
  const decFirstBranch = EARTH_BRANCH_LIST[decFirstBranchIdx];

  const decMap = {
    '子': { xun: '甲子旬', dutyStem: '戊', voidBranches: ['戌','亥'] },
    '戌': { xun: '甲戌旬', dutyStem: '己', voidBranches: ['申','酉'] },
    '申': { xun: '甲申旬', dutyStem: '庚', voidBranches: ['午','未'] },
    '午': { xun: '甲午旬', dutyStem: '辛', voidBranches: ['辰','巳'] },
    '辰': { xun: '甲辰旬', dutyStem: '壬', voidBranches: ['寅','卯'] },
    '寅': { xun: '甲寅旬', dutyStem: '癸', voidBranches: ['子','丑'] },
  };
  return decMap[decFirstBranch] || null;
}

// 驗證年月日時分是否為合理數字，不合理則標紅對應欄位並顯示訊息
function validateDateInputs(y, m, d, h, min) {
  const fields = [
    { id: 'year', valid: Number.isInteger(y) && y >= 1, msg: '年份須為正整數' },
    { id: 'month', valid: Number.isInteger(m) && m >= 1 && m <= 12, msg: '月份須在1–12之間' },
    { id: 'hour', valid: Number.isInteger(h) && h >= 0 && h <= 23, msg: '時須在0–23之間' },
    { id: 'minute', valid: Number.isInteger(min) && min >= 0 && min <= 59, msg: '分須在0–59之間' },
  ];

  // 日的合理範圍要先確定月份合法才能算當月天數，否則先用31上限粗略檢查
  const daysInMonth = (Number.isInteger(y) && Number.isInteger(m) && m >= 1 && m <= 12)
    ? new Date(y, m, 0).getDate()
    : 31;
  fields.push({ id: 'day', valid: Number.isInteger(d) && d >= 1 && d <= daysInMonth, msg: `日須在1–${daysInMonth}之間` });

  const errorMsgs = [];
  fields.forEach(f => {
    const el = document.getElementById(f.id);
    if (!el) return;
    if (f.valid) {
      el.classList.remove('input-error');
    } else {
      el.classList.add('input-error');
      errorMsgs.push(f.msg);
    }
  });

  const msgEl = document.getElementById('input-error-msg');
  if (msgEl) {
    if (errorMsgs.length) {
      msgEl.textContent = errorMsgs.join('；');
      msgEl.style.display = 'block';
    } else {
      msgEl.textContent = '';
      msgEl.style.display = 'none';
    }
  }

  return errorMsgs.length === 0;
}

function castChart() {
  const y   = parseInt(document.getElementById('year').value);
  const m   = parseInt(document.getElementById('month').value);
  const d   = parseInt(document.getElementById('day').value);
  const h   = parseInt(document.getElementById('hour').value);
  const min = parseInt(document.getElementById('minute').value);

  if (!validateDateInputs(y, m, d, h, min)) {
    return;
  }

  // 子時跨日：23:00-23:59 屬於隔日子時，農曆換算需 +1 天，時辰改為 0
  let lunarD = d, lunarM = m, lunarY = y, lunarH = h;
  if (h === 23) {
    const nextDay = new Date(y, m - 1, d + 1);
    lunarY = nextDay.getFullYear();
    lunarM = nextDay.getMonth() + 1;
    lunarD = nextDay.getDate();
    lunarH = 0;
  }

  const solar = Solar.fromYmdHms(lunarY, lunarM, lunarD, lunarH, min, 0);
  const lunar = solar.getLunar();
  const ec = lunar.getEightChar();

  // 西元
  document.getElementById('sy').textContent = y;
  document.getElementById('sm').textContent = String(m).padStart(2,'0');
  document.getElementById('sd').textContent = String(d).padStart(2,'0');
  document.getElementById('st').textContent = String(h * 100 + min).padStart(4,'0');

  // 農曆
  document.getElementById('ly').textContent = lunar.getYear();
  document.getElementById('lm').textContent = String(Math.abs(lunar.getMonth())).padStart(2,'0');
  document.getElementById('ld').textContent = String(lunar.getDay()).padStart(2,'0');
  document.getElementById('lt').textContent = String(h * 100 + min).padStart(4,'0');

  // 四柱
  const yGZ = ec.getYear();
  const mGZ = ec.getMonth();
  const dGZ = ec.getDay();
  const hGZ = ec.getTime();

  document.getElementById('gz-y-gan').textContent = yGZ[0];
  document.getElementById('gz-y-zhi').textContent = yGZ[1];
  document.getElementById('gz-m-gan').textContent = mGZ[0];
  document.getElementById('gz-m-zhi').textContent = mGZ[1];
  document.getElementById('gz-d-gan').textContent = dGZ[0];
  document.getElementById('gz-d-zhi').textContent = dGZ[1];
  document.getElementById('gz-h-gan').textContent = hGZ[0];
  document.getElementById('gz-h-zhi').textContent = hGZ[1];

  // 陰陽遁 + 局數
  const solsticeType = getSolsticeType(y, m, d, h);
  const chartNum = getChartNumber(lunar, h, ec);
  document.getElementById('hb-qiju').textContent = solsticeType + chartNum + '局';

  // 排地盤天干
  const { earthStemMap, houseFiveStem } = getEarthStemMap(solsticeType, chartNum);
  // 地盤天干寫入將在後面取得 dutyStemHouse 後統一處理（入墓判定需要）

  // 旬首 / 符頭 / 空亡
  const decInfo = getDecInfo(hGZ[0], hGZ[1]);
  if (decInfo) {
    document.getElementById('hb-xun').textContent = decInfo.xun;
    document.getElementById('hb-dutyStem').textContent = decInfo.dutyStem;
    document.getElementById('hb-voidBranches').textContent = decInfo.voidBranches.join('、');

    // 清除所有 kong 與 ma
    [1,2,3,4,6,7,8,9].forEach(g => {
      const kongEl = document.getElementById('void-' + g);
      if (kongEl) kongEl.innerHTML = '';
      const maEl = document.getElementById('horse-' + g);
      if (maEl) maEl.innerHTML = '';
    });

    // 先計算馬和空的宮位
    const horseZhi = TRAVEL_HORSE_TABLE[hGZ[1]];
    const horseHouse = horseZhi ? BRANCH_TO_HOUSE[horseZhi] : null;

    // 馬先放（放入 horse- 格）
    if (horseHouse) {
      const el = document.getElementById('horse-' + horseHouse);
      if (el) el.innerHTML = '<span class="tag horse"><span>馬</span></span>';
      document.getElementById('hb-travel-horse').textContent = horseZhi;
    }

    // 空後放（空在右）
    const marked = new Set();
    decInfo.voidBranches.forEach(zhi => {
      const g = BRANCH_TO_HOUSE[zhi];
      const el = document.getElementById('void-' + g);
      if (el && !marked.has(g)) {
        el.innerHTML += '<span class="tag void">空</span>';
        marked.add(g);
      }
    });

    // 值符宮：符頭天干在地盤的宮位
    const dutyStemHouse = Object.keys(earthStemMap).find(g => earthStemMap[g].includes(decInfo.dutyStem));

    if (dutyStemHouse) {
      const dutyStar = HOUSE_STAR[dutyStemHouse];
      document.getElementById('hb-zhifu').textContent = dutyStar || '—';
      document.getElementById('hb-zhishi').textContent = HOUSE_GATE[dutyStemHouse] || '—';

      // 地盤時干宮：時柱天干在地盤的宮位
      // 六甲伏吟：時干為甲，甲不在地盤，改用符頭宮位（甲遁伏於值符下）
      let timeStemHouse = Object.keys(earthStemMap).find(g => earthStemMap[g].includes(hGZ[0]));
      if (!timeStemHouse) timeStemHouse = dutyStemHouse;

      if (timeStemHouse) {
        try {
          // 排八神
          const spiritMap = getSpiritMap(timeStemHouse, solsticeType);
          // 排八星
          const starMap = getStarMap(timeStemHouse, dutyStar);
          // 地盤天干序列（實際順時針讀出，8個位置，寄干宮保留兩個天干）－供天盤天干、引干共用，避免重複計算
          const earthStemSeq = HOUSE_CW.map(g => earthStemMap[g] || '');
          // 排天盤天干
          const heavenStemMap = getHeavenStemMap(timeStemHouse, earthStemSeq, decInfo.dutyStem);
          // 排八門：值使門地盤宮位
          // 走步起點需用「寄坤前」的原始宮位──若符頭天干恰為中宮5寄坤前的原始天干，
          // 數字走步（含中宮）的起點應為5本身，不可用已合併到坤2的位置（5與2在九宮數字
          // 循環中是不同的計數站，提前合併會讓起點算錯）
          const dutyStemHouseForGate = (houseFiveStem && decInfo.dutyStem === houseFiveStem) ? 5 : dutyStemHouse;
          const gateMap = getGateMap(dutyStemHouseForGate, solsticeType, hGZ[0]);
          // 找值使門落宮（天盤使門所在宮位）
          const shimenName = HOUSE_GATE[dutyStemHouse];
          const dutyGateLandHouse = Object.keys(gateMap).find(g => gateMap[g] === shimenName);
          // 星反：天蓬落在離9 → 星反成立
          const isStarReversed = Object.keys(starMap).find(g => starMap[g] === '天蓬') === '9';
          // 門反：休門落在離9 → 門反成立
          const isGateReversed = Object.keys(gateMap).find(g => gateMap[g] === '休門') === '9';

          // 排引干
          const guidingResult = dutyGateLandHouse
            ? getHidingStemMap(dutyGateLandHouse, earthStemMap, earthStemSeq, hGZ[0], decInfo.dutyStem, solsticeType, timeStemHouse, dutyStemHouse)
            : { guidingMap: {}, isStarFrozen: false, isGateFrozen: false, isStarReversed: false };
          const hidingStemMap = guidingResult.guidingMap;

          // 伏吟/反吟標記顯示：有伏吟顯示星伏／門伏（標紅）；有反吟顯示星反（標紅）；無則顯示陰盤
          const fuyinEl = document.getElementById('hb-fuyin');
          if (fuyinEl) {
            const labels = [];
            if (guidingResult.isStarFrozen) labels.push('星伏');
            if (guidingResult.isGateFrozen) labels.push('門伏');
            if (isStarReversed) labels.push('星反');
            if (isGateReversed) labels.push('門反');
            if (labels.length) {
              fuyinEl.textContent = labels.join('');
              fuyinEl.style.color = '#c0392b';
            } else {
              fuyinEl.textContent = '陰盤';
              fuyinEl.style.color = '';
            }
          }

          [1,2,3,4,6,7,8,9].forEach(g => {
            const shenEl = document.getElementById('sh-' + g);
            const starEl = document.getElementById('star-' + g);
            const tianEl = document.getElementById('tian-' + g);
            const gateEl = document.getElementById('gate-' + g);
            const yinEl  = document.getElementById('yin-' + g);
            const diEl   = document.getElementById('di-' + g);
            if (shenEl) shenEl.textContent = spiritMap[g] || '';
            if (starEl) starEl.textContent = starMap[g] || '';
            // 天盤天干（入墓判定，含甲入墓特例）
            if (tianEl) {
              const isDutyHouse = String(g) === String(timeStemHouse);
              tianEl.innerHTML = renderStemHTML(heavenStemMap[g] || '', g, decInfo.dutyStem, isDutyHouse);
            }
            if (gateEl) gateEl.innerHTML = renderGateHTML(gateMap[g] || '', g);
            // 地盤天干（入墓判定，含甲入墓特例）
            if (diEl) {
              const isDutyHouse = String(g) === String(dutyStemHouse);
              diEl.innerHTML = renderStemHTML(earthStemMap[g] || '', g, decInfo.dutyStem, isDutyHouse);
            }
            // 引干（不判定四害）
            if (yinEl) {
              const val = hidingStemMap[g] || '';
              if (!val) { yinEl.innerHTML = ''; return; }
              if ((g === 3 || g === 7) && val.length > 1) {
                yinEl.innerHTML = val.split('').map(ch => `<span>${ch}</span>`).join('');
              } else {
                yinEl.textContent = val;
              }
            }
          });
        } catch(e) {
          console.log('ERROR:', e.message, e.stack);
        }
      }
    }
  }

  document.getElementById('paipan-result').style.display = 'block';
  // 截圖按鈕只在桌面或 iPad 顯示（手機用系統截圖即可）
  const isIPad = /iPad/.test(navigator.userAgent) ||
                 (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isDesktop = navigator.maxTouchPoints === 0 || isIPad;
  if (isDesktop) {
    document.getElementById('btn-capture-wrap').style.display = 'block';
  }
  document.getElementById('paipan-result').scrollIntoView({ behavior: 'smooth' });

  // ── 中宮時辰高亮 ──
  document.querySelectorAll('[data-dz]').forEach(el => el.classList.remove('dz-active'));
  const _h = parseInt(document.getElementById('hour').value) || 0;
  const hourBranch = hourToBranch(_h);
  document.querySelectorAll(`[data-dz="${hourBranch}"]`).forEach(el => el.classList.add('dz-active'));
  clearHighlight();
}
</script>
